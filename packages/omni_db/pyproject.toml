[project]
name = "omni-db"
version = "0.1.0"
description = "Database models, migrations, and repositories for OmniResearch"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "omni-contracts",
    "omni-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_db"]
