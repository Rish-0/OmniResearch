name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import linter
        run: uv run lint-imports

      - name: Mypy strict
        run: uv run mypy packages/omni_contracts/src packages/omni_core/src packages/omni_db/src

      - name: Unit tests
        run: uv run pytest tests/unit -x -v

  compose-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if docker.sock is mounted in any compose service
        run: |
          if grep -r "docker\.sock" infra/docker/compose*.yml; then
            echo "ERROR: docker.sock mount found in compose file!"
            exit 1
          fi

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install

      - name: Web lint
        working-directory: apps/web
        run: pnpm run lint

      - name: Web typecheck
        working-directory: apps/web
        run: pnpm run typecheck
